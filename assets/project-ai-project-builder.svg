<svg xmlns="http://www.w3.org/2000/svg" width="590" height="240" viewBox="0 0 590 240" role="img" aria-label="ProjectAI: Turns a startup idea into a full blueprint: architecture, DB schema, APIs, roadmap and cost estimate.">
  <defs>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#C8A032" stop-opacity="0"/><stop offset=".5" stop-color="#C8A032"/><stop offset="1" stop-color="#C8A032" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="590" height="240" rx="16"/></clipPath>
  </defs>
  <style>
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes ring { 0% { r: 5; opacity: .7; } 100% { r: 14; opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 30px); } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -25px); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .fu { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }

    .sw { animation: sweep 3.5s 0.0s ease-in-out infinite; }
    .live { animation: pulse 2s ease-in-out infinite; }
  </style>
  <g class="fu" style="animation-delay:0.00s">
    <rect x=".5" y=".5" width="589" height="239" rx="16" fill="#10141B" stroke="#232A36"/>
    <g clip-path="url(#c)">
      <rect width="590" height="3" fill="#C8A032" opacity=".35"/>
      <rect class="sw" width="590" height="3" fill="url(#sh)"/>
    </g>
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="32" y="48" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#C8A032">01 · AI · SAAS</text>
      <g><rect x="476" y="30" width="82" height="26" rx="13" fill="#3FB950" fill-opacity=".12" stroke="#3FB950" stroke-opacity=".5"/>
      <circle class="live" cx="494" cy="43" r="4" fill="#3FB950"/>
      <text x="505" y="48" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1" fill="#3FB950">LIVE</text></g>
      <text x="32" y="92" font-size="28" font-weight="700" fill="#E8ECF2">ProjectAI</text>
      <text x="32" y="128" font-size="16" fill="#8B94A3">Turns a startup idea into a full blueprint: architecture, DB</text>
      <text x="32" y="152" font-size="16" fill="#8B94A3">schema, APIs, roadmap and cost estimate.</text>
      <rect x="32" y="186" width="102" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="44" y="205" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">Next.js 15</text><rect x="142" y="186" width="102" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="154" y="205" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">TypeScript</text><rect x="252" y="186" width="71" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="264" y="205" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">Prisma</text><rect x="331" y="186" width="71" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="343" y="205" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">Gemini</text>
    </g>
  </g>
</svg>
