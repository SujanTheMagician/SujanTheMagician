<svg xmlns="http://www.w3.org/2000/svg" width="410" height="214" viewBox="0 0 410 214" role="img" aria-label="ProjectAI: Turns a startup idea into a full blueprint: architecture, DB schema, APIs, roadmap and cost estimate.">
  <defs>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#C8A032" stop-opacity="0"/><stop offset=".5" stop-color="#C8A032"/><stop offset="1" stop-color="#C8A032" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="410" height="214" rx="14"/></clipPath>
  </defs>
  <style>
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes ring { 0% { r: 5; opacity: .7; } 100% { r: 14; opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 30px); } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -25px); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .fu { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }
  .live { animation: pulse 2s ease-in-out infinite; }
  .ping { animation: ring 2s ease-out infinite; }

    .sw { animation: sweep 3.5s 0.0s ease-in-out infinite; }
  </style>
  <g class="fu" style="animation-delay:0.00s">
    <rect x=".5" y=".5" width="409" height="213" rx="14" fill="#10141B" stroke="#232A36"/>
    <g clip-path="url(#c)">
      <rect width="410" height="3" fill="#C8A032" opacity=".35"/>
      <rect class="sw" width="410" height="3" fill="url(#sh)"/>
    </g>
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="24" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2" fill="#C8A032">01 · AI · SAAS</text>
      <rect x="318" y="23" width="68" height="24" rx="12" fill="#3FB950" fill-opacity=".12" stroke="#3FB950" stroke-opacity=".5"/>
      <circle class="live" cx="333" cy="35" r="4" fill="#3FB950"/>
      <text x="343" y="39.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1" fill="#3FB950">LIVE</text>
      <text x="24" y="78" font-size="23" font-weight="700" fill="#E8ECF2">ProjectAI</text>
      <text x="24" y="108" font-size="14.5" fill="#8B94A3">Turns a startup idea into a full blueprint:</text>
      <text x="24" y="129" font-size="14.5" fill="#8B94A3">architecture, DB schema, APIs, roadmap and cost</text>
      <text x="24" y="150" font-size="14.5" fill="#8B94A3">estimate.</text>
      <rect x="24" y="166" width="94" height="26" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="34.8" y="183.32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8B94A3">Next.js 15</text><rect x="126" y="166" width="94" height="26" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="136.8" y="183.32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8B94A3">TypeScript</text><rect x="228" y="166" width="65" height="26" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="238.8" y="183.32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8B94A3">Prisma</text><rect x="301" y="166" width="65" height="26" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="311.8" y="183.32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8B94A3">Gemini</text>
    </g>
  </g>
</svg>
