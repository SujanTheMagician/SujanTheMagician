<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ATIUM Assets: QR-verified custody tracking for ATIUM Sports' physical assets: check-out, returns, internal transfers and maintenance, with role-based access for staff, managers and admins. My first production app, co-built with the ATIUM Sports team.">
