  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 30px); } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -25px); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .fu { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }
  .live { animation: pulse 2s ease-in-out infinite; }
  .ping { animation: ring 2s ease-out infinite; }
