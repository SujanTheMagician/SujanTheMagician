<svg xmlns="http://www.w3.org/2000/svg" width="410" height="214" viewBox="0 0 410 214" role="img" aria-label="FinanceOS: Personal finance dashboard with budgets, goals and analytics in an animated dark UI.">
  <defs>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#64B4FF" stop-opacity="0"/><stop offset=".5" stop-color="#64B4FF"/><stop offset="1" stop-color="#64B4FF" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="410" height="214" rx="14"/></clipPath>
  </defs>
  <style>
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes ring { 0% { r: 5; opacity: .7; } 100% { r: 14; opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 30px); } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -25px); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .fu { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }
  .live { animation: pulse 2s ease-in-out infinite; }
  .ping { animation: ring 2s ease-out infinite; }

    .sw { animation: sweep 3.5s 1.2s ease-in-out infinite; }
  </style>
  <g class="fu" style="animation-delay:0.24s">
    <rect x=".5" y=".5" width="409" height="213" rx="14" fill="#10141B" stroke="#232A36"/>
    <g clip-path="url(#c)">
      <rect width="410" height="3" fill="#64B4FF" opacity=".35"/>
      <rect class="sw" width="410" height="3" fill="url(#sh)"/>
    </g>
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="24" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2" fill="#64B4FF">04 · FINTECH</text>
      <text x="386" y="42" text-anchor="end" font-size="18" fill="#8B94A3">↗</text>
      <text x="24" y="78" font-size="23" font-weight="700" fill="#E8ECF2">FinanceOS</text>
      <text x="24" y="108" font-size="14.5" fill="#8B94A3">Personal finance dashboard with budgets, goals and</text>
      <text x="24" y="129" font-size="14.5" fill="#8B94A3">analytics in an animated dark UI.</text>
      <rect x="24" y="166" width="79" height="26" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="34.8" y="183.32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8B94A3">React 19</text><rect x="111" y="166" width="50" height="26" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="121.8" y="183.32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8B94A3">Vite</text><rect x="169" y="166" width="79" height="26" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="179.8" y="183.32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8B94A3">Recharts</text>
    </g>
  </g>
</svg>
