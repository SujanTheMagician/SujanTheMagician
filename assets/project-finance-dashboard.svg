<svg xmlns="http://www.w3.org/2000/svg" width="590" height="240" viewBox="0 0 590 240" role="img" aria-label="FinanceOS: Personal finance dashboard with budgets, goals and analytics in an animated dark UI.">
  <defs>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#64B4FF" stop-opacity="0"/><stop offset=".5" stop-color="#64B4FF"/><stop offset="1" stop-color="#64B4FF" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="590" height="240" rx="16"/></clipPath>
  </defs>
  <style>
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes ring { 0% { r: 5; opacity: .7; } 100% { r: 14; opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 30px); } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -25px); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .fu { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }

    .sw { animation: sweep 3.5s 1.2s ease-in-out infinite; }
    .live { animation: pulse 2s ease-in-out infinite; }
  </style>
  <g class="fu" style="animation-delay:0.24s">
    <rect x=".5" y=".5" width="589" height="239" rx="16" fill="#10141B" stroke="#232A36"/>
    <g clip-path="url(#c)">
      <rect width="590" height="3" fill="#64B4FF" opacity=".35"/>
      <rect class="sw" width="590" height="3" fill="url(#sh)"/>
    </g>
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="32" y="48" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#64B4FF">04 · FINTECH</text>
      <text x="552" y="50" text-anchor="end" font-size="20" fill="#8B94A3">↗</text>
      <text x="32" y="92" font-size="28" font-weight="700" fill="#E8ECF2">FinanceOS</text>
      <text x="32" y="128" font-size="16" fill="#8B94A3">Personal finance dashboard with budgets, goals and analytics</text>
      <text x="32" y="152" font-size="16" fill="#8B94A3">in an animated dark UI.</text>
      <rect x="32" y="186" width="86" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="44" y="205" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">React 19</text><rect x="126" y="186" width="55" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="138" y="205" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">Vite</text><rect x="189" y="186" width="86" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="201" y="205" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">Recharts</text>
    </g>
  </g>
</svg>
