<svg xmlns="http://www.w3.org/2000/svg" width="540" height="800" viewBox="0 0 540 800" role="img" aria-label="Squad Hub: the private Android app for 78 students and staff of Kalvium at AMET, Squads 91 to 93: notes, projects, doubts with accepted answers, live chat, deadlines, push notifications and a leaderboard. Designed, built and shipped solo. React Native, Expo, TypeScript, Supabase, PostgreSQL.">
  <defs>
    <linearGradient id="sqmbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121820"/><stop offset="1" stop-color="#10141B"/></linearGradient>
    <linearGradient id="sqmsh" x1="0" x2="1"><stop offset="0" stop-color="#C8A032" stop-opacity="0"/><stop offset=".5" stop-color="#C8A032"/><stop offset="1" stop-color="#C8A032" stop-opacity="0"/></linearGradient>
    <linearGradient id="sqmhero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B5B"/><stop offset="1" stop-color="#E3262E"/></linearGradient>
    <filter id="sqmblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="sqmc"><rect width="540" height="800" rx="18"/></clipPath>
  </defs>
  <style>
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes ring { 0% { r: 5; opacity: .7; } 100% { r: 14; opacity: 0; } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -25px); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  @keyframes msg { 0%, 8% { opacity: 0; transform: translateY(10px); } 16%, 88% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .fu { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }
  .live { animation: pulse 2s ease-in-out infinite; }
  .ping { animation: ring 2s ease-out infinite; }
  .sw { animation: sweep 4s ease-in-out infinite; }
  .o1 { animation: drift2 16s ease-in-out infinite; }
  .m1 { animation: msg 7s ease-in-out infinite; }
  .m2 { animation: msg 7s ease-in-out .6s infinite both; }
  .m3 { animation: msg 7s ease-in-out 1.2s infinite both; }
  </style>
  <g class="fu">
    <g clip-path="url(#sqmc)">
      <rect width="540" height="800" fill="url(#sqmbg)"/>
      <circle class="o1" cx="270" cy="650" r="150" fill="#E3262E" opacity=".10" filter="url(#sqmblur)"/>
      <rect width="540" height="3" fill="#C8A032" opacity=".35"/>
      <rect class="sw" width="540" height="3" fill="url(#sqmsh)"/>
    </g>
    <rect x=".5" y=".5" width="539" height="799" rx="18" fill="none" stroke="#232A36"/>
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="36" y="60" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="2" fill="#C8A032">★ FEATURED · SOLO BUILD</text>
      <rect x="36" y="82" width="96" height="30" rx="15" fill="#3FB950" fill-opacity=".10" stroke="#3FB950" stroke-opacity=".5"/>
      <circle class="live" cx="54" cy="97" r="4.5" fill="#3FB950"/>
      <text x="92" y="103" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" letter-spacing="1" fill="#3FB950">LIVE</text>
      <text x="36" y="166" font-size="44" font-weight="700" letter-spacing="-.5" fill="#E8ECF2">Squad Hub</text>
      <text x="36" y="210" font-size="22" fill="#8B94A3">The private Android app for 78</text>
      <text x="36" y="242" font-size="22" fill="#8B94A3">students and staff of Kalvium @ AMET,</text>
      <text x="36" y="274" font-size="22" fill="#8B94A3">Squads 91–93: notes, projects, doubts,</text>
      <text x="36" y="306" font-size="22" fill="#8B94A3">live chat, deadlines, push alerts and</text>
      <text x="36" y="338" font-size="22" fill="#8B94A3">a leaderboard.</text>
      <text x="36" y="378" font-size="20" font-style="italic" fill="#E8ECF2" opacity=".85">Designed, built and shipped solo:</text>
      <text x="36" y="410" font-size="20" font-style="italic" fill="#E8ECF2" opacity=".85">first commit to v1.4 in 3 days.</text>
      <rect x="36" y="432" width="137" height="34" rx="7" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="51.3" y="455.6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#8B94A3">React Native</text>
      <rect x="181" y="432" width="62" height="34" rx="7" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="196.3" y="455.6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#8B94A3">Expo</text>
      <rect x="251" y="432" width="118" height="34" rx="7" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="266.3" y="455.6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#8B94A3">TypeScript</text>
      <rect x="36" y="474" width="100" height="34" rx="7" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="51.3" y="497.6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#8B94A3">Supabase</text>
      <rect x="144" y="474" width="118" height="34" rx="7" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="159.3" y="497.6" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#8B94A3">PostgreSQL</text>
    </g>
    <g transform="translate(-755 510)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <rect x="950" y="30" width="150" height="240" rx="22" fill="#0B0E14" stroke="#232A36" stroke-width="1.5"/>
      <rect x="1005" y="38" width="40" height="5" rx="2.5" fill="#232A36"/>
      <rect x="960" y="50" width="130" height="50" rx="12" fill="url(#sqmhero)"/>
      <text x="972" y="70" font-size="11" font-weight="700" fill="#FFFFFF">Squad Hub</text>
      <text x="972" y="88" font-size="9.5" fill="#FFFFFF" opacity=".85">Good evening, Squad 92</text>
      <circle class="ping" cx="1076" cy="66" r="5" fill="none" stroke="#FFFFFF"/>
      <circle cx="1076" cy="66" r="4" fill="#FFFFFF"/>
      <g class="m1">
        <rect x="960" y="110" width="104" height="28" rx="14" fill="#8B5CF6" fill-opacity=".18" stroke="#8B5CF6" stroke-opacity=".6"/>
        <text x="972" y="128" font-size="10" fill="#E8ECF2">Doubt solved ✓</text>
      </g>
      <g class="m2">
        <rect x="986" y="146" width="104" height="28" rx="14" fill="#14B8A6" fill-opacity=".18" stroke="#14B8A6" stroke-opacity=".6"/>
        <text x="998" y="164" font-size="10" fill="#E8ECF2">New DBMS notes</text>
      </g>
      <g class="m3">
        <rect x="960" y="182" width="118" height="28" rx="14" fill="#F59E0B" fill-opacity=".18" stroke="#F59E0B" stroke-opacity=".6"/>
        <text x="972" y="200" font-size="10" fill="#E8ECF2">Hackathon in 2 days</text>
      </g>
      <rect x="960" y="232" width="130" height="26" rx="13" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <circle cx="980" cy="245" r="4" fill="#FF5A4E"/>
      <circle cx="1005" cy="245" r="3" fill="#8B94A3"/>
      <circle cx="1025" cy="245" r="3" fill="#8B94A3"/>
      <circle cx="1045" cy="245" r="3" fill="#8B94A3"/>
      <circle cx="1070" cy="245" r="3" fill="#8B94A3"/>
    </g>
  </g>
</svg>
