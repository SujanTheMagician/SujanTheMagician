<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Squad Hub: the private Android app for 78 students and staff of Kalvium at AMET, Squads 91 to 93: notes, projects, doubts with accepted answers, live chat, deadlines, push notifications and a leaderboard, with over-the-air updates. Designed, built and shipped solo. React Native, Expo, TypeScript, Supabase, PostgreSQL.">
  <defs>
    <linearGradient id="sqbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121820"/><stop offset="1" stop-color="#10141B"/></linearGradient>
    <linearGradient id="sqsh" x1="0" x2="1"><stop offset="0" stop-color="#C8A032" stop-opacity="0"/><stop offset=".5" stop-color="#C8A032"/><stop offset="1" stop-color="#C8A032" stop-opacity="0"/></linearGradient>
    <linearGradient id="sqhero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B5B"/><stop offset="1" stop-color="#E3262E"/></linearGradient>
    <filter id="sqblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="sqc"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes ring { 0% { r: 5; opacity: .7; } 100% { r: 14; opacity: 0; } }
  @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-50px, -25px); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  @keyframes msg { 0%, 8% { opacity: 0; transform: translateY(10px); } 16%, 88% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .fu { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }
  .live { animation: pulse 2s ease-in-out infinite; }
  .ping { animation: ring 2s ease-out infinite; }
  .sw { animation: sweep 4s ease-in-out infinite; }
  .o1 { animation: drift2 16s ease-in-out infinite; }
  .m1 { animation: msg 7s ease-in-out infinite; }
  .m2 { animation: msg 7s ease-in-out .6s infinite both; }
  .m3 { animation: msg 7s ease-in-out 1.2s infinite both; }
  </style>
  <g class="fu">
    <g clip-path="url(#sqc)">
      <rect width="1200" height="300" fill="url(#sqbg)"/>
      <circle class="o1" cx="1025" cy="150" r="150" fill="#E3262E" opacity=".10" filter="url(#sqblur)"/>
      <rect width="1200" height="3" fill="#C8A032" opacity=".35"/>
      <rect class="sw" width="1200" height="3" fill="url(#sqsh)"/>
    </g>
    <rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#232A36"/>
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="48" y="58" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#C8A032">★ FEATURED · SOLO BUILD</text>
      <rect x="280" y="40" width="96" height="26.4" rx="13.2" fill="#3FB950" fill-opacity=".10" stroke="#3FB950" stroke-opacity=".5"/>
      <circle class="live" cx="296" cy="53.2" r="4" fill="#3FB950"/>
      <text x="334" y="58" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="1" fill="#3FB950">LIVE</text>
      <text x="48" y="110" font-size="38" font-weight="700" letter-spacing="-.5" fill="#E8ECF2">Squad Hub</text>
      <text x="48" y="148" font-size="17" fill="#8B94A3">The private Android app for 78 students and staff of Kalvium @ AMET,</text>
      <text x="48" y="174" font-size="17" fill="#8B94A3">Squads 91–93: notes, projects, doubts with accepted answers, live chat,</text>
      <text x="48" y="200" font-size="17" fill="#8B94A3">deadlines, push notifications and a leaderboard, with over-the-air updates.</text>
      <text x="48" y="234" font-size="15" font-style="italic" fill="#E8ECF2" opacity=".85">Designed, built and shipped solo: first commit to v1.4 in 3 days.</text>
      <rect x="48" y="256" width="116" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="59.7" y="274.68" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">React Native</text>
      <rect x="172" y="256" width="55" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="183.7" y="274.68" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">Expo</text>
      <rect x="235" y="256" width="101" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="246.7" y="274.68" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">TypeScript</text>
      <rect x="344" y="256" width="86" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="355.7" y="274.68" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">Supabase</text>
      <rect x="438" y="256" width="101" height="28" rx="6" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <text x="449.7" y="274.68" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#8B94A3">PostgreSQL</text>
    </g>
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <rect x="950" y="30" width="150" height="240" rx="22" fill="#0B0E14" stroke="#232A36" stroke-width="1.5"/>
      <rect x="1005" y="38" width="40" height="5" rx="2.5" fill="#232A36"/>
      <rect x="960" y="50" width="130" height="50" rx="12" fill="url(#sqhero)"/>
      <text x="972" y="70" font-size="11" font-weight="700" fill="#FFFFFF">Squad Hub</text>
      <text x="972" y="88" font-size="9.5" fill="#FFFFFF" opacity=".85">Good evening, Squad 92</text>
      <circle class="ping" cx="1076" cy="66" r="5" fill="none" stroke="#FFFFFF"/>
      <circle cx="1076" cy="66" r="4" fill="#FFFFFF"/>
      <g class="m1">
        <rect x="960" y="110" width="104" height="28" rx="14" fill="#8B5CF6" fill-opacity=".18" stroke="#8B5CF6" stroke-opacity=".6"/>
        <text x="972" y="128" font-size="10" fill="#E8ECF2">Doubt solved ✓</text>
      </g>
      <g class="m2">
        <rect x="986" y="146" width="104" height="28" rx="14" fill="#14B8A6" fill-opacity=".18" stroke="#14B8A6" stroke-opacity=".6"/>
        <text x="998" y="164" font-size="10" fill="#E8ECF2">New DBMS notes</text>
      </g>
      <g class="m3">
        <rect x="960" y="182" width="118" height="28" rx="14" fill="#F59E0B" fill-opacity=".18" stroke="#F59E0B" stroke-opacity=".6"/>
        <text x="972" y="200" font-size="10" fill="#E8ECF2">Hackathon in 2 days</text>
      </g>
      <rect x="960" y="232" width="130" height="26" rx="13" fill="#FFFFFF" fill-opacity=".04" stroke="#232A36"/>
      <circle cx="980" cy="245" r="4" fill="#FF5A4E"/>
      <circle cx="1005" cy="245" r="3" fill="#8B94A3"/>
      <circle cx="1025" cy="245" r="3" fill="#8B94A3"/>
      <circle cx="1045" cy="245" r="3" fill="#8B94A3"/>
      <circle cx="1070" cy="245" r="3" fill="#8B94A3"/>
    </g>
  </g>
</svg>
